name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile
        run: ./mvnw compile -B

      - name: Run tests
        run: ./mvnw test -B

  python-client:
    # Pinned: ubuntu-latest is Ubuntu 26.04, which setup-python has no 3.8 build for.
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        # The oldest interpreter the client claims to support and a current
        # one, so syntax or typing that only newer releases accept is caught.
        python-version: [ '3.8', '3.12' ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest
