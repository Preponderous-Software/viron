# Test configuration. Mirrors the runtime properties apart from the datasource, which points at
# an in-memory database, and supplies a fixed JWT secret so the Spring context (which now
# requires app.jwt.secret) starts in tests.

spring.application.name=viron
server.port=9999

# An in-memory database rather than the runtime Postgres. Context tests mock DbInteractions, so
# no SQL is issued against it, but the transaction boundaries on the write paths open a real
# connection before the mocked call — against an unreachable Postgres those requests fail with a
# 500 instead of exercising the controller.
database.dbUrl=jdbc:h2:mem:viron_test;DB_CLOSE_DELAY=-1
database.dbUsername=sa
database.dbPassword=
# Deliberately not the Java defaults (10 and 5000), so DataSourceConfigTest can tell a value
# bound from this file apart from one DbConfig would have supplied on its own.
database.maxPoolSize=4
database.lockTimeoutMs=2500

# Mirrors the runtime setting: no database contributor on /actuator/health, so
# SecurityConfigTest's health check does not depend on a reachable database.
management.health.db.enabled=false

service.vironHost=http://localhost
service.vironPort=9999

# Fixed test secret (>= 32 bytes for HS256). Not a real credential.
app.jwt.secret=viron-test-jwt-secret-0123456789-abcdefghij
app.jwt.issuer=userauth
app.jwt.algorithm=HS256

# Usage reporting stays off in tests so no context start-up ever contacts the trace service.
# UsageReporterStartupEventTest turns it back on against a loopback stub it owns.
usage-reporting.enabled=false
