services:
  postgres:
    image: postgres:12
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DATABASE_DB_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_DB_PASSWORD}
      POSTGRES_DB: ${DATABASE_DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db-scripts/setup:/docker-entrypoint-initdb.d
  
  viron:
    build: .
    container_name: viron
    ports:
      - "9999:9999"
    environment:
      DATABASE_DB_URL: jdbc:postgresql://${DATABASE_DB_HOST}:${DATABASE_DB_PORT}/${DATABASE_DB_NAME}
      DATABASE_DB_USERNAME: ${DATABASE_DB_USERNAME}
      DATABASE_DB_PASSWORD: ${DATABASE_DB_PASSWORD}
      # The lock wait bound and the pool size, set as a pair; see README.md.
      DATABASE_LOCK_TIMEOUT_MS: ${DATABASE_LOCK_TIMEOUT_MS:-5000}
      DATABASE_MAX_POOL_SIZE: ${DATABASE_MAX_POOL_SIZE:-10}
      SERVICE_VIRON_HOST: ${SERVICE_VIRON_HOST}
      SERVICE_VIRON_PORT: ${SERVICE_VIRON_PORT}
      VIRON_DEBUG_ENABLED: ${VIRON_DEBUG_ENABLED:-false}
      # Required — the service does not start without it. Must match UserAuth's secret.
      # The :? form makes compose refuse to start rather than pass an empty secret through.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set; see sample.env}
      JWT_ISSUER: ${JWT_ISSUER:-userauth}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      # One "startup" usage event goes to the trace service on start-up; false turns it off.
      USAGE_REPORTING_ENABLED: ${USAGE_REPORTING_ENABLED:-true}
    depends_on:
      - postgres

volumes:
  postgres_data: